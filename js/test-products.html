<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار المنتجات</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { padding: 20px; background: #f5f5f5; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #3A36E0; margin-bottom: 30px; text-align: center; }
        .test-section { background: white; padding: 20px; margin: 20px 0; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        button { background: #3A36E0; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; }
        .product { background: #f8f9ff; padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid #e4e6ef; }
        .log { background: #1a1a2e; color: white; padding: 15px; margin: 10px 0; border-radius: 8px; font-family: monospace; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 اختبار ظهور المنتجات</h1>
        
        <div class="test-section">
            <h2>1. اختبار Firebase</h2>
            <button onclick="testFirebase()">فحص اتصال Firebase</button>
            <button onclick="testFirebaseProducts()">جلب منتجات Firebase</button>
            <div id="firebase-result" class="log"></div>
        </div>
        
        <div class="test-section">
            <h2>2. اختبار البيانات المحلية</h2>
            <button onclick="testLocalProducts()">عرض المنتجات المحلية</button>
            <div id="local-result" class="log"></div>
            <div id="local-products"></div>
        </div>
        
        <div class="test-section">
            <h2>3. اختبار نظام المنتجات</h2>
            <button onclick="testProductsManager()">فحص ProductsManager</button>
            <div id="manager-result" class="log"></div>
        </div>
        
        <div class="test-section">
            <h2>4. الذهاب للمتجر الرئيسي</h2>
            <button onclick="location.href='index.html'" style="background: #00D4AA; padding: 15px 30px; font-size: 18px;">
                ← العودة للمتجر الرئيسي
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    
    <script>
        // تهيئة Firebase
        let db = null;
        try {
            const app = firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            console.log('✅ Firebase مهيأ');
        } catch (error) {
            console.log('❌ خطأ في تهيئة Firebase:', error);
        }
        
        // بيانات المنتجات المحلية (مثل products.js)
        const localProducts = {
            offers: [
                { id: 'offer1', name: 'عرض خاص على ساعات اليد', price: 250, image: '⌚', description: 'خصم 29% لفترة محدودة' },
                { id: 'offer2', name: 'مجموعة مستحضرات تجميل', price: 180, image: '💄', description: 'مجموعة كاملة بخصم 28%' }
            ],
            accessories: [
                { id: 'acc1', name: 'ساعة يد فاخرة', price: 350, image: '⌚', description: 'ساعة يد أنيقة بتصميم عصري' },
                { id: 'acc2', name: 'قلادة ذهبية', price: 420, image: '🔗', description: 'قلادة ذهبية عيار 18 قيراط' }
            ]
        };
        
        // اختبار Firebase
        async function testFirebase() {
            const log = document.getElementById('firebase-result');
            log.innerHTML = '⏳ جاري فحص Firebase...\n';
            
            if (!db) {
                log.innerHTML += '❌ Firebase غير مهيأ\n';
                return;
            }
            
            try {
                log.innerHTML += '✅ Firebase مهيأ\n';
                
                // اختبار الاتصال
                const test = await db.collection('products').limit(1).get();
                log.innerHTML += `📊 الاتصال ناجح: ${test.size} منتج متاح\n`;
                
                if (test.empty) {
                    log.innerHTML += '⚠️ Firebase متصل لكن فارغ\n';
                } else {
                    test.forEach(doc => {
                        log.innerHTML += `📄 عينة منتج: ${JSON.stringify(doc.data(), null, 2)}\n`;
                    });
                }
            } catch (error) {
                log.innerHTML += `❌ خطأ في Firebase: ${error.message}\n`;
            }
        }
        
        async function testFirebaseProducts() {
            const log = document.getElementById('firebase-result');
            log.innerHTML = '⏳ جلب جميع منتجات Firebase...\n';
            
            if (!db) {
                log.innerHTML += '❌ Firebase غير مهيأ\n';
                return;
            }
            
            try {
                const snapshot = await db.collection('products').get();
                log.innerHTML += `📊 عدد المنتجات: ${snapshot.size}\n\n`;
                
                if (snapshot.empty) {
                    log.innerHTML += '📭 لا توجد منتجات في Firebase\n';
                    return;
                }
                
                // عرض المنتجات حسب الفئة
                const categories = {};
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const category = data.category || 'offers';
                    
                    if (!categories[category]) categories[category] = [];
                    categories[category].push({
                        id: doc.id,
                        name: data.name,
                        price: data.price,
                        category: category
                    });
                });
                
                // عرض النتائج
                Object.keys(categories).forEach(category => {
                    log.innerHTML += `\n🏷️ فئة ${category}: ${categories[category].length} منتج\n`;
                    categories[category].forEach(product => {
                        log.innerHTML += `   • ${product.name} - ${product.price} ريال\n`;
                    });
                });
                
            } catch (error) {
                log.innerHTML += `❌ خطأ: ${error.message}\n`;
            }
        }
        
        // اختبار البيانات المحلية
        function testLocalProducts() {
            const log = document.getElementById('local-result');
            const container = document.getElementById('local-products');
            
            log.innerHTML = '📊 البيانات المحلية:\n';
            container.innerHTML = '';
            
            Object.keys(localProducts).forEach(category => {
                log.innerHTML += `\n🏷️ ${category}: ${localProducts[category].length} منتج\n`;
                
                const categoryDiv = document.createElement('div');
                categoryDiv.innerHTML = `<h3>${category} (${localProducts[category].length})</h3>`;
                
                localProducts[category].forEach(product => {
                    const productDiv = document.createElement('div');
                    productDiv.className = 'product';
                    productDiv.innerHTML = `
                        <strong>${product.name}</strong><br>
                        السعر: ${product.price} ريال<br>
                        ${product.description}
                    `;
                    categoryDiv.appendChild(productDiv);
                });
                
                container.appendChild(categoryDiv);
            });
        }
        
        // اختبار ProductsManager
        function testProductsManager() {
            const log = document.getElementById('manager-result');
            log.innerHTML = '🔍 فحص ProductsManager...\n';
            
            log.innerHTML += `window.productsManager: ${window.productsManager ? '✅ موجود' : '❌ غير موجود'}\n`;
            
            if (window.productsManager) {
                log.innerHTML += `window.productsManager.products: ${window.productsManager.products ? '✅ موجود' : '❌ غير موجود'}\n`;
                
                if (window.productsManager.products) {
                    const total = Object.values(window.productsManager.products).reduce((sum, arr) => sum + arr.length, 0);
                    log.innerHTML += `📊 إجمالي المنتجات: ${total}\n`;
                    
                    Object.keys(window.productsManager.products).forEach(category => {
                        const count = window.productsManager.products[category].length;
                        if (count > 0) {
                            log.innerHTML += `   ${category}: ${count} منتج\n`;
                        }
                    });
                }
            }
        }
        
        // تشغيل الاختبارات تلقائياً
        window.onload = function() {
            setTimeout(() => {
                testFirebase();
                testProductsManager();
            }, 1000);
        };
    </script>
</body>
</html>
