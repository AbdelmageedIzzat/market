<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر الإلكتروني</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- شريط التنقل -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h1>متجري</h1>
            </div>
            
            <!-- شريط البحث -->
            <div class="search-container">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="ابحث عن منتج...">
                    <button id="searchBtn"><i class="fas fa-search"></i></button>
                </div>
                <div id="searchResults" class="search-results"></div>
            </div>
            
            <div class="cart-icon" onclick="toggleCart()">
                <i class="fas fa-shopping-cart"></i>
                <span id="cartCount">0</span>
            </div>
        </div>
    </nav>

    <!-- المنتجات -->
    <div class="container">
        <h2 class="section-title">منتجاتنا</h2>
        <div class="products-grid" id="productsContainer">
            <!-- سيتم تعبئة المنتجات عبر JavaScript -->
        </div>
    </div>

    <!-- السلة -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>سلة التسوق</h3>
            <button class="close-cart" onclick="toggleCart()">×</button>
        </div>
        <div class="cart-items" id="cartItems">
            <!-- سيتم تعبئة عناصر السلة عبر JavaScript -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>الإجمالي:</span>
                <span id="cartTotal">0.00</span> <span>ريال</span>
            </div>
            <button class="checkout-btn" onclick="openCheckout()">إتمام الطلب</button>
        </div>
    </div>

    <!-- نافذة إتمام الطلب -->
    <div class="checkout-modal" id="checkoutModal">
        <div class="checkout-content">
            <div class="checkout-header">
                <h3>إتمام الطلب</h3>
                <button class="close-checkout" onclick="closeCheckout()">×</button>
            </div>
            
            <div class="checkout-body">
                <!-- تفاصيل العميل -->
                <div class="form-section">
                    <h4>معلومات العميل</h4>
                    <div class="form-group">
                        <input type="text" id="customerName" placeholder="الاسم الكامل" required>
                    </div>
                    <div class="form-group">
                        <input type="tel" id="customerPhone" placeholder="رقم الهاتف" required>
                    </div>
                    <div class="form-group">
                        <textarea id="customerAddress" placeholder="العنوان" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <textarea id="customerNotes" placeholder="ملاحظات إضافية" rows="2"></textarea>
                    </div>
                </div>

                <!-- طرق الدفع -->
                <div class="form-section">
                    <h4>طريقة الدفع</h4>
                    <div class="payment-methods" id="paymentMethods">
                        <!-- سيتم تعبئة طرق الدفع عبر JavaScript -->
                    </div>
                </div>

                <!-- تأكيد الطلب -->
                <div class="form-section">
                    <div class="order-summary">
                        <h4>ملخص الطلب</h4>
                        <div id="orderSummary">
                            <!-- سيتم تعبئة ملخص الطلب عبر JavaScript -->
                        </div>
                        <div class="order-total">
                            <span>المجموع الكلي:</span>
                            <span id="orderTotal">0.00</span> <span>ريال</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="checkout-footer">
                <button class="confirm-order-btn" onclick="confirmOrder()">تأكيد الطلب</button>
                <button class="cancel-btn" onclick="closeCheckout()">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- نافذة التأكيد النهائي -->
    <div class="final-confirmation-modal" id="finalConfirmationModal">
        <div class="final-confirmation-content">
            <div class="confirmation-header">
                <h3><i class="fas fa-check-circle"></i> تأكيد الطلب النهائي</h3>
            </div>
            
            <div class="confirmation-body">
                <div class="order-details-confirm" id="orderDetailsConfirm">
                    <!-- سيتم تعبئة تفاصيل الطلب عبر JavaScript -->
                </div>
                
                <div class="whatsapp-notice">
                    <i class="fab fa-whatsapp"></i>
                    <p>سيتم إرسال هذا الطلب عبر الواتساب إلى البائع للتجهيز</p>
                </div>
                
                <div class="final-warning">
                    <p><strong>⚠️ الرجاء التأكد من صحة المعلومات قبل الإرسال</strong></p>
                </div>
            </div>
            
            <div class="confirmation-footer">
                <button class="send-whatsapp-btn" onclick="sendToWhatsApp()">
                    <i class="fab fa-whatsapp"></i> تأكيد وإرسال بالواتساب
                </button>
                <button class="edit-order-btn" onclick="editOrder()">تعديل الطلب</button>
            </div>
        </div>
    </div>

    <!-- Overlay للسلة -->
    <div class="overlay" id="cartOverlay" onclick="toggleCart()"></div>

    <script src="script.js"></script>
</body>
</html>
